role: Postdoctoral Research Fellow in Bioelectricity and Experimental Physiology
bio: 'Dr Victor Frankenstein is a Geneva-based early career researcher exploring the boundary between life and non-life. His work combines experimental chemistry, comparative anatomy, electrical stimulation and regenerative medicine in pursuit of one modest question: can damaged biological systems be restored to full and independent function? He completed his PhD in 2023 and is now a Postdoctoral Research Fellow at the Geneva Institute for Experimental Science.'
interests:
- Bioelectric signalling and galvanic response
- Regenerative physiology
- Restoration of damaged biological tissue
- Experimental anatomy
- The relationship between consciousness and physical form
- Scientific ambition, responsibility, and unintended consequences
- Laboratory security and noise reduction
