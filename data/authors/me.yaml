bio: |
  Dr Victor Frankenstein is an independent scholar working at the intersection
  of natural philosophy, bioelectricity, anatomy, and regenerative medicine.
  His research investigates the mechanisms by which inert biological systems
  may be restored to functional activity. He is committed to responsible
  innovation, rigorous confidentiality, and acquiring all anatomical materials
  through entirely reputable channels.
